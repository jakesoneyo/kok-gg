[project]
name = "kok-gg-ai"
version = "0.1.0"
description = "kok.gg AI 서비스 — 요약·검색·예산 원장 (FastAPI, ai 스키마 소유)"
requires-python = ">=3.12"
# ARCHITECTURE.md 11장 상한 목록 안에서 "지금 쓰는 것만". pgvector 파이썬 패키지는 쓰지 않는다(벡터는 SQL 리터럴 캐스트).
dependencies = [
  "fastapi~=0.165",
  "uvicorn[standard]~=0.54",
  "sqlalchemy~=2.1",
  "psycopg[binary]~=3.3",
  "alembic~=1.20",
  "pydantic-settings~=2.16",
  "kiwipiepy~=0.25",
  "anthropic~=2.14",
  "httpx~=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest~=9.2",
  "ruff~=0.17",
  "testcontainers[postgres]~=4.15",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 줄 길이는 ruff format에 맡김(한글 주석·긴 SQL 문자열은 포매터가 못 줄임)
ignore = ["E501"]
